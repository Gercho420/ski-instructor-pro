    <!--
      Schema.org: usamos "Service" en vez de "LocalBusiness" porque el negocio
      no tiene local físico (clases in situ en pista, dos zonas de servicio).
      Los valores de contacto (whatsapp/instagram) son los defaults actuales
      del panel admin (categoría "contact"); si se cambian ahí, actualizar
      también acá a mano hasta que se generen dinámicamente.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Clases de Ski y Snowboard",
      "name": "SkiPro | Clases de Ski Profesionales",
      "description": "Clases de ski y snowboard para todos los niveles: principiantes, intermedio, avanzado, privadas, grupales y para niños.",
      "provider": {
        "@type": "Organization",
        "name": "SkiPro",
        "sameAs": ["https://instagram.com/skipro"]
      },
      "areaServed": [
        {
          "@type": "City",
          "name": "San Carlos de Bariloche",
          "containedInPlace": { "@type": "Country", "name": "Argentina" }
        },
        {
          "@type": "AdministrativeArea",
          "name": "Andorra",
          "containedInPlace": { "@type": "Country", "name": "Andorra" }
        }
      ],
      "image": "%VITE_SITE_URL%/hero-ski_c1cd739e.webp",
      "availableChannel": {
        "@type": "ServiceChannel",
        "servicePhone": "+34 600 000 000",
        "availableLanguage": ["es", "en", "pt"]
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Clases de Ski",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Clases para Principiantes" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Clases Nivel Intermedio" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Clases Nivel Avanzado" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Clases Privadas" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Clases Grupales" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Clases para Niños" } }
        ]
      },
      "url": "%VITE_SITE_URL%/"
    }
    </script>
</head>
